<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Communication &amp; Impression — identité visuelle et supports imprimés">
  <defs>
    <linearGradient id="ci-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1330"/><stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="ci-glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0" stop-color="rgba(255,138,30,0.32)"/><stop offset="1" stop-color="rgba(255,138,30,0)"/>
    </radialGradient>
    <radialGradient id="ci-glow2" cx="86%" cy="88%" r="55%">
      <stop offset="0" stop-color="rgba(34,211,238,0.28)"/><stop offset="1" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
    <linearGradient id="ci-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ci-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
    <pattern id="ci-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="rgba(148,163,209,0.10)"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#ci-bg)"/>
  <rect width="640" height="360" fill="url(#ci-dots)"/>
  <rect width="640" height="360" fill="url(#ci-glow1)"/>
  <rect width="640" height="360" fill="url(#ci-glow2)"/>

  <!-- large-format banner / signage on stand -->
  <g transform="translate(360 40)">
    <rect x="0" y="0" width="228" height="150" rx="12" fill="#0a1028" stroke="rgba(148,163,209,0.20)"/>
    <rect x="0" y="0" width="228" height="150" rx="12" fill="rgba(47,107,255,0.10)"/>
    <circle cx="40" cy="42" r="18" fill="url(#ci-brand)"/>
    <rect x="70" y="32" width="120" height="12" rx="6" fill="rgba(238,242,255,0.9)"/>
    <rect x="70" y="52" width="86" height="9" rx="4.5" fill="#22d3ee" opacity="0.8"/>
    <rect x="24" y="92" width="180" height="8" rx="4" fill="rgba(148,163,209,0.30)"/>
    <rect x="24" y="108" width="150" height="8" rx="4" fill="rgba(148,163,209,0.22)"/>
    <rect x="24" y="124" width="96" height="8" rx="4" fill="rgba(148,163,209,0.16)"/>
    <!-- stand legs -->
    <path d="M60 150 L44 214 M168 150 L184 214" stroke="rgba(148,163,209,0.35)" stroke-width="3" stroke-linecap="round"/>
    <rect x="40" y="214" width="148" height="6" rx="3" fill="rgba(148,163,209,0.25)"/>
  </g>

  <!-- brandmark glass tile -->
  <g transform="translate(44 46)">
    <rect x="0" y="0" width="110" height="110" rx="20" fill="rgba(12,19,48,0.85)" stroke="rgba(148,163,209,0.20)"/>
    <circle cx="55" cy="48" r="26" fill="none" stroke="url(#ci-accent)" stroke-width="6"/>
    <circle cx="55" cy="48" r="9" fill="#ff9a1f"/>
    <rect x="30" y="86" width="50" height="8" rx="4" fill="rgba(238,242,255,0.75)"/>
  </g>

  <!-- business cards stacked -->
  <g transform="translate(70 190)">
    <g transform="rotate(-8)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="#111a3e" stroke="rgba(148,163,209,0.18)"/>
      <rect x="16" y="18" width="46" height="8" rx="4" fill="rgba(238,242,255,0.85)"/>
      <rect x="16" y="32" width="70" height="6" rx="3" fill="#22d3ee" opacity="0.7"/>
      <rect x="16" y="60" width="90" height="5" rx="2.5" fill="rgba(148,163,209,0.30)"/>
      <rect x="16" y="72" width="66" height="5" rx="2.5" fill="rgba(148,163,209,0.22)"/>
      <circle cx="124" cy="26" r="12" fill="url(#ci-brand)"/>
    </g>
    <g transform="translate(40 34) rotate(6)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="url(#ci-brand)"/>
      <rect x="0" y="0" width="150" height="92" rx="12" fill="rgba(5,7,15,0.08)"/>
      <circle cx="26" cy="28" r="13" fill="rgba(5,7,15,0.28)"/>
      <rect x="16" y="54" width="100" height="7" rx="3.5" fill="rgba(5,7,15,0.42)"/>
      <rect x="16" y="68" width="72" height="6" rx="3" fill="rgba(5,7,15,0.30)"/>
    </g>
  </g>

  <!-- color swatches (impression) -->
  <g transform="translate(470 226)">
    <rect x="0" y="0" width="128" height="64" rx="14" fill="rgba(12,19,48,0.85)" stroke="rgba(148,163,209,0.20)"/>
    <circle cx="26" cy="32" r="12" fill="#ff7a00"/>
    <circle cx="52" cy="32" r="12" fill="#22d3ee"/>
    <circle cx="78" cy="32" r="12" fill="#2f6bff"/>
    <circle cx="104" cy="32" r="12" fill="#eef2ff"/>
  </g>
</svg>
