<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Informatique &amp; Maintenance — serveurs, réseau et cybersécurité">
  <defs>
    <linearGradient id="it-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1330"/><stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="it-glow1" cx="22%" cy="20%" r="60%">
      <stop offset="0" stop-color="rgba(47,107,255,0.38)"/><stop offset="1" stop-color="rgba(47,107,255,0)"/>
    </radialGradient>
    <radialGradient id="it-glow2" cx="86%" cy="86%" r="55%">
      <stop offset="0" stop-color="rgba(255,138,30,0.26)"/><stop offset="1" stop-color="rgba(255,138,30,0)"/>
    </radialGradient>
    <linearGradient id="it-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="it-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <pattern id="it-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="rgba(148,163,209,0.10)"/>
    </pattern>
  </defs>
  <style>
    .led{animation:it-led 1.8s ease-in-out infinite;}
    .led2{animation:it-led 1.8s ease-in-out infinite;animation-delay:.6s;}
    .led3{animation:it-led 1.8s ease-in-out infinite;animation-delay:1.1s;}
    @keyframes it-led{0%,100%{opacity:1;}50%{opacity:.25;}}
    .node{transform-origin:center;animation:it-node 2.6s ease-out infinite;}
    @keyframes it-node{0%{transform:scale(.8);opacity:1;}70%{transform:scale(1.7);opacity:0;}100%{opacity:0;}}
    @media (prefers-reduced-motion:reduce){.led,.led2,.led3,.node{animation:none;}}
  </style>

  <rect width="640" height="360" fill="url(#it-bg)"/>
  <rect width="640" height="360" fill="url(#it-dots)"/>
  <rect width="640" height="360" fill="url(#it-glow1)"/>
  <rect width="640" height="360" fill="url(#it-glow2)"/>

  <!-- network nodes -->
  <g stroke="url(#it-accent)" stroke-width="1.3" fill="none" opacity="0.5">
    <path d="M300 120 L470 70 M300 120 L500 170 M300 120 L150 66 M300 120 L120 190"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="470" cy="70" r="5"/><circle cx="500" cy="170" r="5"/><circle cx="150" cy="66" r="5"/><circle cx="120" cy="190" r="5"/>
  </g>
  <circle class="node" cx="470" cy="70" r="5" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <circle class="node" cx="150" cy="66" r="5" fill="none" stroke="#ff9a1f" stroke-width="2" style="animation-delay:1.3s"/>

  <!-- server rack -->
  <g transform="translate(78 96)">
    <rect x="0" y="0" width="150" height="196" rx="14" fill="#0a1028" stroke="rgba(148,163,209,0.22)"/>
    <g>
      <rect x="14" y="16" width="122" height="30" rx="7" fill="rgba(148,163,209,0.07)"/>
      <rect x="14" y="54" width="122" height="30" rx="7" fill="rgba(148,163,209,0.07)"/>
      <rect x="14" y="92" width="122" height="30" rx="7" fill="rgba(148,163,209,0.07)"/>
      <rect x="14" y="130" width="122" height="30" rx="7" fill="rgba(148,163,209,0.07)"/>
    </g>
    <g>
      <circle cx="28" cy="31" r="4" fill="#22d3ee"/><circle class="led" cx="42" cy="31" r="4" fill="#ff9a1f"/>
      <circle cx="28" cy="69" r="4" fill="#22d3ee"/><circle class="led3" cx="42" cy="69" r="4" fill="#22d3ee"/>
      <circle class="led2" cx="28" cy="107" r="4" fill="#ff9a1f"/><circle cx="42" cy="107" r="4" fill="#22d3ee"/>
      <circle cx="28" cy="145" r="4" fill="#22d3ee"/><circle class="led" cx="42" cy="145" r="4" fill="#22d3ee"/>
    </g>
    <g fill="rgba(148,163,209,0.30)">
      <rect x="66" y="26" width="58" height="10" rx="3"/>
      <rect x="66" y="64" width="46" height="10" rx="3"/>
      <rect x="66" y="102" width="58" height="10" rx="3"/>
      <rect x="66" y="140" width="40" height="10" rx="3"/>
    </g>
    <rect x="14" y="172" width="122" height="12" rx="4" fill="url(#it-accent)" opacity="0.55"/>
  </g>

  <!-- security shield -->
  <g transform="translate(356 92)">
    <path d="M70 0 L136 24 V78 C136 128 108 158 70 176 C32 158 4 128 4 78 V24 Z"
          fill="rgba(12,19,48,0.9)" stroke="url(#it-shield)" stroke-width="3"/>
    <path d="M70 18 L120 36 V80 C120 118 98 142 70 156 C42 142 20 118 20 80 V36 Z"
          fill="rgba(34,211,238,0.07)"/>
    <path d="M46 84 L64 104 L98 60" fill="none" stroke="url(#it-accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- cloud backup chip -->
  <g transform="translate(452 232)">
    <rect x="0" y="0" width="146" height="60" rx="14" fill="rgba(12,19,48,0.85)" stroke="rgba(148,163,209,0.20)"/>
    <path d="M28 40 a14 14 0 0 1 2 -28 a16 16 0 0 1 30 4 a12 12 0 0 1 -2 24 Z" fill="none" stroke="#22d3ee" stroke-width="2.6"/>
    <path d="M44 26 v14 M44 26 l-6 6 M44 26 l6 6" stroke="#ff9a1f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="20" width="52" height="8" rx="4" fill="rgba(238,242,255,0.8)"/>
    <rect x="78" y="34" width="36" height="7" rx="3.5" fill="#22d3ee" opacity="0.7"/>
  </g>
</svg>
