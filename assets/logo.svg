  <!-- Wordmark -->
  <text x="58" y="30" font-family="'Sora','Segoe UI',sans-serif" font-size="20" font-weight="700" letter-spacing="-0.4" fill="url(#msText)">Marketing</text>
  <text x="58" y="49" font-family="'Sora','Segoe UI',sans-serif" font-size="20" font-weight="700" letter-spacing="0.5" fill="#ff9a1f">Success</text>
