<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Marketing Success</title>
<meta name="theme-color" content="#05070f">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse 800px 500px at 50% -10%,rgba(47,107,255,0.30),transparent 60%),radial-gradient(ellipse 600px 400px at 80% 110%,rgba(255,138,30,0.18),transparent 60%),var(--navy-950);}
  .nf .code{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(90px,20vw,190px);line-height:1;
    background:linear-gradient(100deg,var(--orange-500),var(--orange-600) 40%,var(--cyan-400));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.04em;}
  .nf h1{font-size:clamp(22px,3vw,30px);margin:8px 0 14px;}
  .nf p{color:var(--grey-400);max-width:440px;margin-bottom:32px;font-size:16px;}
  .nf .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .nf .logo-top{position:absolute;top:28px;left:32px;}
  .nf .logo-top img{height:34px;}
</style>
</head>
<body>
<div class="nf">
  <a href="index.html" class="logo-top" aria-label="Marketing Success — accueil"><img src="assets/logo.svg" alt="Marketing Success"></a>
  <div class="code">404</div>
  <h1>Cette page a pris un autre chemin.</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée. Revenons à l'essentiel : votre croissance digitale.</p>
  <div class="actions">
    <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
    <a href="index.html#contact" class="btn btn-ghost">Nous contacter</a>
  </div>
</div>
</body>
</html>
